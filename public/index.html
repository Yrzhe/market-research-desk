<!doctype html>
<html lang="zh-Hans">
<head>

  <meta name="description" content="四市场研究监测与证据看板">
  <title>Market Research Desk</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/app.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#overview" aria-label="Market Research Desk 首页">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><path d="M7 5v22M7 8h10M7 16h16M7 24h20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="17" cy="8" r="2" fill="currentColor"/><circle cx="23" cy="16" r="2" fill="currentColor"/><circle cx="27" cy="24" r="2" fill="currentColor"/></svg>
        <span class="brand-copy"><strong>Market Research</strong><small>EVIDENCE DESK</small></span>
      </a>
      <div class="nav-caption">工作空间</div>
      <nav class="main-nav" aria-label="主要页面">
        <a href="#overview" data-nav="overview">总览</a>
        <a href="#assets" data-nav="assets">标的</a>
        <a href="#alerts" data-nav="alerts">待核验</a>
        <a href="#decisions" data-nav="decisions">判断台账</a>

      <div class="top-actions">
        <button id="theme-toggle" class="icon-button" type="button" aria-label="切换深浅色模式" title="切换深浅色模式">

      </div>
      <div class="rail-foot">事实监测 · 证据归档<span>只读研究工作台</span></div>
    </div>
  </header>
  <main id="app" class="page" aria-live="polite"><div class="loading">正在读取运行档案…</div></main>
  <footer class="site-footer">Market Research Desk · 事实监测与证据归档</footer>
  <div id="detail-layer" class="detail-layer" hidden></div>
